<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>Software &amp; Data Security Simulator</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f6f7f4;--card:#fff;--tx:#1c2321;--mu:#5d6762;--ac:#2f7d4f;--bad:#c0392b;--ln:#d9ded8;--nd:#e8ebe6}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#141816;--card:#1d2320;--tx:#e8ece9;--mu:#9aa5a0;--ac:#6fcf97;--bad:#ff7b6b;--ln:#323b36;--nd:#2a332e}}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 system-ui,sans-serif}main{max-width:900px;margin:auto;padding:14px}
h1{font-size:22px;margin:6px 0}nav{display:flex;gap:6px;overflow-x:auto;padding:6px 0}
nav button{white-space:nowrap;border:1px solid var(--ln);background:var(--card);color:var(--tx);padding:6px 10px;border-radius:16px;cursor:pointer}
nav button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.card{background:var(--card);border:1px solid var(--ln);border-radius:10px;padding:12px;margin:10px 0}
svg{width:100%;height:auto;display:block}.nd rect{fill:var(--nd);stroke:var(--ln);transition:.3s}.nd text{fill:var(--tx);font-size:12px;text-anchor:middle}
.nd.on rect{fill:var(--ac);stroke:var(--ac)}.nd.on text{fill:#fff}.nd.bad rect{fill:var(--bad);stroke:var(--bad)}.nd.bad text{fill:#fff}
.ctl{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.ctl button{padding:6px 12px;border-radius:6px;border:1px solid var(--ac);background:var(--ac);color:#fff;cursor:pointer}
#st{padding:8px;border-left:4px solid var(--ac);background:var(--nd);margin-top:8px}#st.bad{border-color:var(--bad)}
.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px}h3{margin:0 0 4px;font-size:15px}ul{margin:0;padding-left:18px}
.t{overflow-x:auto}table{border-collapse:collapse;width:100%}td,th{border-bottom:1px solid var(--ln);padding:4px 8px;text-align:left;font-size:13px}
input{width:100%;padding:6px;border:1px solid var(--ln);border-radius:6px;background:var(--card);color:var(--tx)}
</style></head><body><main>
<h1>Software &amp; Data Security Simulator</h1>
<nav id="nav"></nav><div id="v"></div>
<div class="card"><h3>Glossary of terms</h3><input id="q" placeholder="Search terms..."><div class="t"><table id="gl"></table></div></div>
</main><script>
const D={"M":[{"id":"env","t":"1. Software Environment","i":"Software lives in layers (apps, OS user mode, kernel mode, hardware+TPM) and talks to clients and the cloud. Three lifecycle views add risk: design (smallest threat surface), runtime (largest), and post-retirement (old versions still exposed).","n":[["app","Application",90,40],["api","API / Services",90,120],["sm","Security Monitor",310,120],["hal","HAL / Drivers",310,205],["tpm","Hardware + TPM",520,205],["cl","Cloud / Client-Server",520,40]],"s":[["An application asks for a service through the API (user mode).","app","api"],["The call crosses the gate into kernel mode; the Security Monitor checks permissions.","api","sm"],["Approved requests go through memory/process managers and drivers to the HAL, which translates to the CPU instruction set.","sm","hal"],["Hardware executes; the TPM supplies a root of trust (keys, boot integrity measurements).","hal","tpm"],["Results sync to the cloud over the internet, which widens the threat surface.","tpm","cl"]],"p":["Layer separation isolates faults","HAL enables virtualization and portability","TPM gives hardware-rooted trust"],"c":["Every layer is attack surface","Kernel bugs are catastrophic","Cloud links add remote exposure"],"a":["Commercial: Windows/Linux servers with TPM BitLocker","Defense: hardened OS with secure boot","Medical: special-purpose OS in pacemakers","Industrial: embedded OS in PLCs"]},{"id":"mal","t":"2. Malware Lifecycle","i":"Malware types: virus (needs host), worm (self-spreads), Trojan (deceives), ransomware, logic bomb (trigger), dropper, keylogger, spyware, boot-sector virus, zombie/botnet.","n":[["att","Attacker",70,120],["lure","Phishing mail / file",230,40],["usr","User / Host",390,120],["drp","Dropper / Trojan",230,205],["bot","Botnet C&C",600,40],["pay","Payload (encrypt/steal)",600,205]],"s":[["Attacker delivers a lure: email attachment, fake game or macro document.","att","lure",1],["User clicks or opens it (social engineering); a virus attaches to a host file, a Trojan hides inside useful software.","lure","usr",1],["A dropper installs further code and a backdoor; worms spread over the network by vulnerabilities.","usr","drp",1],["Host becomes a zombie and joins a botnet awaiting commands.","drp","bot",1],["Trigger fires (date/action) and payload runs: ransomware encrypts, keylogger steals, DDoS starts.","drp","pay",1]],"p":["Understanding stages lets you break the chain at each step","Known strains have signatures"],"c":["Authors constantly change code to evade","APT-weaponized ransomware is organized and persistent"],"a":["Seen in: WannaCry, SQL Slammer, ILOVEYOU, Melissa, Michelangelo","Used defensively by red teams to emulate threats (MITRE ATT&CK)"]},{"id":"rk","t":"3. Rootkits","i":"A rootkit hides malicious presence to keep privileged access. Types: persistent, memory-based, user-mode, kernel-mode.","n":[["app","Admin tool (Explorer)",80,40],["win","Windows API",80,120],["rk","Rootkit hook",300,120],["nat","Native API",300,205],["ker","Kernel (SSDT / DKOM)",540,205],["lst","Process / file list",540,40]],"s":[["A tool lists files or processes using FindFirstFile or Task Manager.","app","win"],["User-mode rootkit hooks the call (DLL modification) and intercepts it.","win","rk",1],["The call continues to the Native API; advanced rootkits also hook this to defeat API-vs-Native comparisons.","rk","nat",1],["Kernel-mode rootkits alter the SSDT or use DKOM to unlink their process from kernel structures.","nat","ker",1],["The returned list omits the malware, so the tool shows a clean system.","ker","lst",1]],"p":["Studying them improves detection design","Rebuild from clean media guarantees removal"],"c":["Hard to detect and remove","Kernel level runs with admin-equal power; detectors can be fooled","Persistent ones survive reboot"],"a":["Defense: offline scans, TPM-measured boot, IDS signatures","Threat research: memory forensics","Seen: Mebroot MBR rootkit (2007)"]},{"id":"web","t":"4. Web & Database Attacks","i":"Fourteen database attack patterns include aggregation/inference, bypass, view compromise, alternative routes, contamination, deadlock, DoS, improper modification, interception, query (SQL injection), physical access, TOCTOU, web-based, unauthorized access. OWASP lists XSS, CSRF, injection, broken authentication, IDOR.","n":[["att","Attacker",70,120],["web","Web App",240,40],["qe","Query Engine / View",410,120],["db","DBMS",580,40],["fil","Data Files",580,205],["dmz","DMZ",240,205]],"s":[["Attacker submits a malformed input (SQL injection / XSS) to the web app.","att","web",1],["App builds a dynamic query without validation and sends it to the query engine.","web","qe",1],["Query bypasses the view restrictions; aggregation of harmless rows can infer sensitive data.","qe","db",1],["Alternative route: direct DB or file access skips the controls, or TOCTOU changes data after approval.","db","fil",1],["Poor architecture (DB placed in the DMZ) lets the web app breach expose customer data.","att","dmz",1]],"p":["Views give field-level control","Parameterized queries, input validation and least privilege block most attacks"],"c":["Views limit seen data, not operations","Multiple access routes are hard to secure","Deadlocks or table scans cause DoS"],"a":["Commercial: e-commerce, payment systems (PCI DSS)","Defense/gov: classified DB with labels","Banking: web banking WAFs"]},{"id":"se","t":"5. Social Engineering & Recon","i":"Phishing, smishing, vishing, spear phishing, whaling, scareware, plus low-tech recon: dumpster diving, shoulder surfing, Googling, media and social media intel.","n":[["rec","Recon (web, media, trash)",90,60],["pre","Pretext (call / email / SMS)",300,150],["vic","Victim / Finance staff",510,60],["act","Credential or wire transfer",510,205],["att","Attacker",90,205]],"s":[["Attacker gathers lingo, contacts and partners from websites, news, social media, dumpsters.","rec","pre",1],["Builds a convincing message: phishing (mass), spear phishing (targeted), whaling (executives).","pre","vic",1],["Victim is pressured to act: click, reveal a password, or pay a fake invoice.","vic","act",1],["Attacker collects the data or money and may pivot deeper.","act","att",1]],"p":["Awareness programs create a human firewall cheaply","Microtraining is just-in-time"],"c":["Humans can still be fooled","Hard to measure effectiveness"],"a":["Corporate: phishing simulations","Banks: KYC and call-back verification","Defense: OPSEC training"]},{"id":"det","t":"6. Detection & All-Source Intelligence","i":"Inputs (IT/OT logs, UEBA, HUMINT) go through SIEM analytics and become a product: recommendations to leadership. Behavior blocking and sandboxes complement antivirus.","n":[["it","IT/OT logs & sensors",80,40],["ue","UEBA behavior",80,120],["hu","HUMINT / help desk",80,205],["si","SIEM analytics",320,120],["an","Analyst",500,205],["dec","Management decision",600,40]],"s":[["Logs, process measurements and sensors stream in from every system.","it","si"],["UEBA profiles every user, process and device; outliers are flagged.","ue","si"],["Human sources (tickets, HR, threat blogs) add context, with privacy law care.","hu","si"],["SIEM correlates events across time to spot APT precursors.","si","an"],["Analyst reports meaning plus recommendation; leadership acts.","an","dec"]],"p":["Spots unknown and insider threats","Context reduces false alarms"],"c":["Needs skilled staff and tuning","Privacy and labor-law limits","Anomaly detection needs a good baseline"],"a":["Commercial: SOC with Splunk/Sentinel","Defense: threat-intel fusion centers","Critical infrastructure: OT monitoring"]},{"id":"def","t":"7. Countermeasures","i":"Defense in depth: training, hardening, patching, isolation (VLAN, microsegmentation), DLP, antimalware, sandbox, CSIRT.","n":[["trn","Awareness & training",90,40],["hrd","Hardening & patching",300,40],["iso","Isolation / VLAN",510,40],["dlp","DLP & antimalware",510,205],["sbx","Sandbox analysis",300,205],["csi","CSIRT response",90,205]],"s":[["Train users (human firewall).","trn","hrd"],["Disable unneeded services, patch on time to shrink the attack window.","hrd","iso"],["Isolate critical and legacy systems to stop lateral movement.","iso","dlp"],["DLP governs data sharing; antimalware blocks known and anomalous code.","dlp","sbx"],["Suspicious samples are run in a sandbox to learn behavior and make signatures.","sbx","csi"],["CSIRT contains, eradicates and recovers, then feeds lessons back.","csi","trn"]],"p":["Layers cover each other's gaps","Sandboxes reveal C&C and behavior safely"],"c":["Cost and complexity","Signature AV needs fresh updates","Malware can detect sandboxes"],"a":["Commercial: PCI DSS-mandated antimalware","Defense: network segmentation, CERTs","Healthcare/energy: protect availability against DoS"]},{"id":"sw","t":"8. Software Types & Mobile Code","i":"Four categories: operating systems (general or special purpose, bound to CPU via HAL), utility programs, application programs, and mobile code / executable content (scripts, macros, applets that travel from server to client).","n":[["os","Operating System",80,40],["ut","Utilities (Sysinternals, QR scanner)",80,205],["ap","Applications / apps / IAAA",330,120],["web","Web server",560,40],["mc","Mobile code (JS, ActiveX)",560,205]],"s":[["The OS abstracts CPU, network and storage; the HAL lets it run on different instruction sets and enables virtualization.","os","ap"],["Utilities run stand-alone in user mode for specific jobs, such as system management or format translation.","ut","ap"],["Applications (games, accounting, IAAA, antimalware) use OS services and need the most security attention.","ap","web"],["The web page downloads with embedded script; it executes on the client as the page renders.","web","mc",1],["Every app has a boundary and threat surface; an APT-style attacker probes it for easy entry.","mc","ap",1]],"p":["Clear categories guide control choices","Mobile code gives rich web features"],"c":["Mobile code runs on the client unexpectedly","Large threat surface at every boundary"],"a":["Commercial: Windows/Android/iOS","Medical: special-purpose OS in pacemakers","Mobile: apps, wearables, browser plug-ins"]},{"id":"dev","t":"9. Secure Development & Protection Approaches","i":"Secure software flows from requirements, specs, design, testing and security assessment to user procedures. Six approaches reduce risk: process, behavior, safety, standards/compliance, quality/integrity, availability.","n":[["rq","Requirements",70,40],["sp","Specifications",250,40],["ds","Design",430,40],["ts","Test & security assessment",430,205],["tr","User procedures & training",250,205],["op","Operation",70,205]],"s":[["Start with purpose plus functional and nonfunctional requirements.","rq","sp"],["Flow down into detailed system specifications.","sp","ds"],["Design software, systems and workflows. Errors here are cheapest to fix and easiest to control.","ds","ts"],["Test quality and assess security before release; rapid updates trade speed for safety.","ts","tr"],["Create end-user procedures and training.","tr","op"],["At runtime the threat surface is largest; apply the six approaches, then retire old versions that may still be vulnerable.","op","rq",1]],"p":["Early fixes cost less","Multiple viewpoints expose different gaps"],"c":["Schedule pressure skips testing","Overlapping versions stay exposed for years"],"a":["Commercial: SDLC, DevSecOps","Safety: medical, energy, process control","Compliance: PCI DSS audits"]},{"id":"owa","t":"10. OWASP Web Vulnerabilities","i":"Injection, XSS, CSRF, broken authentication and IDOR exploit poorly built web apps that were rushed to market.","n":[["bw","Browser",80,120],["ws","Web app",300,120],["db","Database",520,40],["vi","Victim",520,205],["at","Attacker",300,230]],"s":[["Injection: attacker input (SQL, LDAP, OS command) is run as a command by the backend.","at","db",1],["XSS: a malicious script stored or reflected in a page runs in the victim browser.","ws","vi",1],["CSRF: a forged request rides on the victim logged-in session.","bw","ws",1],["Broken authentication: weak or exposed sessions let an attacker impersonate a user.","at","ws",1],["IDOR: changing an ID in a URL returns another user data because no access check exists.","at","db",1]],"p":["Documented, preventable, testable","OWASP gives a shared checklist"],"c":["Still the cause of most breaches","Fast release cycles skip testing"],"a":["Commercial: WAFs, penetration tests","Banking and e-commerce","Government portals"]},{"id":"agg","t":"11. Database: Aggregation, Bypass, Views, Alternate Routes","i":"Aggregation combines harmless data into sensitive data; inference extracts more than allowed. Bypass skips the front end; views can be attacked; alternative routes and TOCTOU defeat checks.","n":[["us","User",70,120],["vw","View",260,40],["qe","Query engine",260,205],["db","DBMS",450,120],["fl","Files / OS access",620,205]],"s":[["Aggregation: the user combines unclassified rows from separate sources into classified knowledge; inference follows.","us","vw",1],["Compromised view: the user modifies a view, or uses it to perform unrestricted operations on visible data.","us","vw",1],["Bypass attack: avoids the query engine and CLI front end.","us","db",1],["Alternate route: direct query or file system access reaches the same data unprotected.","us","fl",1],["TOCTOU: data is changed between approval of the query and display of results.","db","us",1]],"p":["Field-level, content-based views are granular","Labels and least privilege restrict access"],"c":["Hard to verify view processing","Multiple routes to the same data"],"a":["Defense/government: multilevel secure DBs","Healthcare records","Financial data warehouses"]},{"id":"dl","t":"12. Database: Deadlock, DoS, Contamination, Interception, Modification","i":"Reliability and integrity attacks on databases and warehouses.","n":[["p1","Process A",90,40],["p2","Process B",90,205],["r1","Lock on table 1",330,40],["r2","Lock on table 2",330,205],["db","DBMS / admin",560,120]],"s":[["Deadlock: A holds table 1 and waits for table 2; B holds table 2 and waits for table 1.","p1","r2",1],["Resolution: the system aborts the cheapest transaction to roll back and sends an error to the user.","db","p2"],["DoS: a poor query or full table scan locks tables and starves authorized users.","p2","r1",1],["Data contamination: malformed field, record or file input disrupts the system.","p1","db",1],["Interception of remote sessions, or improper (even accidental) modification, harms confidentiality and integrity.","p2","db",1]],"p":["Lock managers keep consistency","Input validation and TLS reduce harm"],"c":["Deadlocks are hard to recognize","Rollback costs time"],"a":["Banking transaction systems","Airline reservations","Hospital records"]},{"id":"rkt","t":"13. Four Windows Rootkit Types","i":"Persistent, memory-based, user-mode and kernel-mode rootkits.","n":[["pe","Persistent (registry/file)",80,40],["me","Memory-based",80,205],["um","User-mode (DLL hook)",330,120],["km","Kernel-mode (SSDT, DKOM, gate/MSR)",580,120]],"s":[["Persistent: code is stored in the registry or file system and runs every boot or login.","pe","um",1],["Memory-based: no persistent code, so a reboot removes it.","me","um",1],["User-mode: hooks system calls in each application memory space (FindFirstFile/FindNextFile).","um","km",1],["Kernel-mode: hooks the user-to-kernel gate (interrupt or MSR), edits the SSDT, or unlinks processes via DKOM.","km","um",1]],"p":["Know what to hunt for","Kernel hooks are reliable for researchers too"],"c":["Detectors share the same privilege level","Rebuild needed"],"a":["EDR and forensics","Secure boot with TPM"]},{"id":"ins","t":"14. Insider Threat, DoS & APT","i":"Insiders exfiltrate data; DoS attacks threaten availability in hospitals, FAA towers and nuclear cooling; zombies amplify DoS; APTs use OWASP flaws and unknown vulnerabilities.","n":[["in","Insider",80,40],["ex","Data exfiltration",300,40],["ap","APT actor",80,205],["zb","Zombie botnet",300,205],["tg","Critical service",540,120]],"s":[["A disgruntled or compromised insider uses valid privileges to copy huge volumes of data.","in","ex",1],["Without continuous monitoring, the breach is discovered only after damage is done.","ex","tg",1],["An APT patiently recons and exploits known or zero-day vulnerabilities.","ap","zb",1],["Zombies flood the target in a DDoS, giving immediate disruption.","zb","tg",1],["Hospitals, FAA towers or nuclear cooling lose availability, with possible loss of life.","tg","ap",1]],"p":["ML anomaly detection catches insiders","Prioritizing availability protects safety"],"c":["Insiders look legitimate","Monitoring raises privacy issues"],"a":["Defense: counter-insider programs","Healthcare, aviation, energy","Commercial: DDoS scrubbing"]},{"id":"med","t":"15. Media Threats & Due Diligence","i":"Press coverage and social media reveal targets; the same sources support KYC and pre-employment screening.","n":[["nw","News & contracts",80,40],["sm","Social media posts",80,205],["ac","Threat actor",330,120],["tg","Organization",580,40],["dd","Due diligence",580,205]],"s":[["News of contracts, facilities or problems draws attention.","nw","ac",1],["Employee posts leak details or sentiment.","sm","ac",1],["The actor profiles the organization and its people, then targets it.","ac","tg",1],["Defender uses the same sources for KYC and screening of clients and hires.","dd","tg"]],"p":["Cheap, open-source vetting","Reduces hiring risk"],"c":["Cannot control media or staff posts","Privacy limits"],"a":["Banks: KYC","HR background checks","Defense: OPSEC reviews"]},{"id":"am","t":"16. Antimalware, Behavior Blocking & Sandbox","i":"Signature and anomaly antivirus, behavior blockers, spyware tools, sandboxes and interactive behavioral testing.","n":[["sm","Suspicious file",80,120],["av","Signature / ML scan",300,40],["bb","Behavior blocker",300,205],["sb","Sandbox",520,40],["it","Interactive test (fake IRC)",520,205]],"s":[["The file is scanned against signatures and anomaly models (needs fresh signatures).","sm","av"],["A behavior blocker watches file, disk, startup and network actions in real time, blocking even obfuscated code.","sm","bb"],["Limitation: it must run first, so some harm may occur.","bb","sm",1],["Sandbox: run in isolation to observe behavior and C&C, though some malware detects it.","av","sb"],["Interactive testing: redirect via HOSTS to a lab server and interact with the malware.","sb","it"]],"p":["Behavior blocking defeats obfuscation","Sandbox yields signatures"],"c":["Signatures lag new malware","Anomaly models need baselines","Sandbox evasion"],"a":["Enterprise endpoint suites","Vendor labs (CWSandbox)","PCI DSS compliance"]},{"id":"cs","t":"17. CSIRT & Preparation","i":"Prepare, detect and respond. CSIRT offers reactive, proactive and security-quality services; hardening can follow risk-based sensitivity.","n":[["pr","Prepare / train",80,120],["dt","Detect",260,40],["ct","Contain",440,40],["er","Eradicate",440,205],["rc","Recover",260,205],["ll","Lessons learned",620,120]],"s":[["Build the CSIRT, procedures and microtraining before an incident.","pr","dt"],["Detect precursors and indicators.","dt","ct"],["Contain spread and eradicate malware.","ct","er"],["Recover systems.","er","rc"],["Share lessons and tighten hardening based on risk.","rc","ll"]],"p":["Faster response","Shared community knowledge"],"c":["Costly to staff","Needs authority"],"a":["Corporate SOCs","National CERTs (CERT/CC)","Product PSIRTs"]},{"id":"atm","t":"18. ATM & POS Attacks","i":"Shoulder surfing and swiping capture PINs and card data.","n":[["cm","Hidden camera",90,60],["rd","Fake reader / RFID",90,205],["vc","Cardholder",330,120],["cl","Cloned card + PIN",570,120]],"s":[["Camera or an onlooker records the PIN.","cm","vc",1],["Fake reader or RFID scanner reads the card data.","rd","vc",1],["Attacker combines both into a clone and withdraws cash.","vc","cl",1]],"p":["Awareness helps","Chip and PIN reduce cloning"],"c":["Hard to inspect devices"],"a":["Banks: tamper checks","Retail POS"]}],"G":[["APT","Advanced Persistent Threat","Sophisticated long-running attacker"],["API","Application Programming Interface","Way for apps to request services"],["ATM","Automated Teller Machine",""],["C&C","Command and Control","Server directing botnets"],["COTS","Commercial Off-The-Shelf","Ready-made software"],["CPU","Central Processing Unit",""],["CERT","Computer Emergency Response Team",""],["CSIRT","Computer Security Incident Response Team",""],["CSRF","Cross-Site Request Forgery","Forged request using victim session"],["DKOM","Direct Kernel Object Modification","Rootkit edits kernel structures"],["DLL","Dynamic Link Library","Shared Windows code"],["DLP","Data Loss Prevention","Controls data leaving"],["DMZ","Demilitarized Zone","Network zone between internet and LAN"],["DoS / DDoS","(Distributed) Denial of Service","Make a service unavailable"],["DBMS","Database Management System",""],["HAL","Hardware Abstraction Layer","Translates OS to hardware"],["HUMINT","Human Intelligence",""],["IAAA","Identification, Authentication, Authorization, Accounting",""],["IDOR","Insecure Direct Object Reference",""],["IDS/IPS","Intrusion Detection / Prevention System",""],["IoT","Internet of Things",""],["KYC","Know Your Customer","Due-diligence vetting"],["MBR","Master Boot Record",""],["MSR","Model-Specific Register",""],["OS","Operating System",""],["OT","Operational Technology","Industrial control systems"],["OWASP","Open Worldwide Application Security Project",""],["PCI DSS","Payment Card Industry Data Security Standard",""],["POS","Point of Sale",""],["PUP","Potentially Unwanted Program",""],["RFID","Radio-Frequency Identification",""],["SIEM","Security Information and Event Management",""],["SQL","Structured Query Language",""],["SSDT","System Service Descriptor Table","Kernel function pointer table"],["TOCTOU","Time-of-Check to Time-of-Use","Race condition"],["TPM","Trusted Platform Module","Hardware security chip"],["UEBA","User and Entity Behavior Analytics",""],["VLAN","Virtual Local Area Network",""],["XSS","Cross-Site Scripting","Injecting script into pages"],["SDLC","Software Development Life Cycle",""],["CLI","Command-Line Interface",""],["HTML","HyperText Markup Language",""],["XML","Extensible Markup Language",""],["UPC","Universal Product Code",""],["QRC","Quick-Response Code",""],["HOSTS","Hosts file","Local name-to-address map"],["IRC","Internet Relay Chat",""],["TLS","Transport Layer Security",""],["WAF","Web Application Firewall",""],["EDR","Endpoint Detection and Response",""],["MITRE ATT&CK","Adversary tactics knowledge base",""],["DMAS","Dynamic Malware Analysis System",""],["P-SIRT","Product Security Incident Response Team",""],["PIN","Personal Identification Number",""],["LDAP","Lightweight Directory Access Protocol",""],["WRAP","Weaponization","Packaging attack elements into a bundle"]]};let cur=0,k=0,timer=null,raf;
const $=id=>document.getElementById(id);
D.M.forEach((m,i)=>{const b=document.createElement("button");b.textContent=m.t;b.onclick=()=>show(i);$("nav").append(b)});
function show(i){cur=i;k=-1;stop();[...$("nav").children].forEach((b,j)=>b.classList.toggle("on",i==j));const m=D.M[i];
const N=Object.fromEntries(m.n.map(n=>[n[0],n]));
$("v").innerHTML=`<div class="card"><p>${m.i}</p><svg id="sv" viewBox="0 0 700 250">${m.n.map(n=>`<g class="nd" id="n_${n[0]}"><rect x="${n[2]-62}" y="${n[3]-20}" width="124" height="40" rx="8"/><text x="${n[2]}" y="${n[3]+4}">${n[1]}</text></g>`).join("")}<circle id="dot" r="7" fill="#e6a700" cx="-20" cy="-20"/></svg>
<div class="ctl"><button id="pv">Prev</button><button id="pl">Play</button><button id="nx">Next</button><span id="sn"></span></div><div id="st">Press Play or Next to start.</div></div>
<div class="card"><h3>Working principle (steps)</h3><ol>${m.s.map(s=>`<li>${s[0]}</li>`).join("")}</ol></div>
<div class="g"><div class="card"><h3>Pros</h3><ul>${m.p.map(x=>`<li>${x}</li>`).join("")}</ul></div><div class="card"><h3>Cons</h3><ul>${m.c.map(x=>`<li>${x}</li>`).join("")}</ul></div><div class="card"><h3>Applications / deployments</h3><ul>${m.a.map(x=>`<li>${x}</li>`).join("")}</ul></div></div>`;
$("nx").onclick=()=>go(1);$("pv").onclick=()=>go(-1);$("pl").onclick=()=>timer?stop():(go(1),$("pl").textContent="Pause",timer=setInterval(()=>go(1),3200));}
function stop(){clearInterval(timer);timer=null;const p=$("pl");if(p)p.textContent="Play"}
function go(d){const m=D.M[cur],N=Object.fromEntries(m.n.map(n=>[n[0],n]));k=(k+d+m.s.length)%m.s.length;const s=m.s[k];
document.querySelectorAll(".nd").forEach(e=>e.classList.remove("on","bad"));
const a=N[s[1]],b=N[s[2]];$("n_"+s[1]).classList.add(s[3]?"bad":"on");
$("st").textContent=s[0];$("st").className=s[3]?"bad":"";$("sn").textContent=`Step ${k+1}/${m.s.length}`;
